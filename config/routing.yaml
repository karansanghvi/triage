# Triage routing and reliability settings

# Fallback chains: for each tier, the models to try in order.
# The FIRST model must be the Phase 2 model for that tier (config/collection.yaml): the classifier
# learned "will this exact model pass?", so live routing must call the same model.
# Backups are on a different provider, so one provider outage can't take down a whole tier.
# Backups are a reliability safety net: their answers aren't what the classifier predicted,
# so responses served by a backup should be logged as such.
fallback_chains:
  low: [groq-allam, ollama-llama]      # local llama3.2:3b: similar quality, no provider dependency
  medium: [groq-small, gemini-flash]   # gemini-flash: different provider, at least medium quality
  high: [groq-large, gemini-flash]     # only non-Groq option; free tier is tiny (20/day), backup only

# Retries apply only to rate limits (429) and server errors (5xx).
retry:
  max_attempts: 3            # tries per model, including the first one
  base_delay_seconds: 0.5    # first wait is up to 0.5s, then up to 1s, then 2s...
  max_delay_seconds: 8       # never wait longer than this between tries

# After this many failures in a row, skip that provider for a while.
circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 60

# No single call may take longer than this.
timeout_seconds: 30

quality:
  default: balanced          # used when a request has no X-Triage-Quality header
  presets:                   # placeholders; set from the train-set Pareto curve in Phase 3 Step 4
    cheap: 0.4
    balanced: 0.6
    high: 0.8

# The trained classifier the live router uses (models/<name>_<tier>_v<version>.joblib/.json).
# Placeholder pick: best cross-validation scores on train so far (AUC and log loss, both tiers).
# The final choice comes from the Pareto curve in Phase 3 Step 4.
classifier:
  name: classifier_c_logreg_cv
  version: 1

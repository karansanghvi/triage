# Triage routing and reliability settings

# Fallback chains: for each tier, the models to try in order.
# The FIRST model must be the Phase 2 model for that tier (config/collection.yaml): the classifier
# learned "will this exact model pass?", so live routing must call the same model.
# Backups are on a different provider, so one provider outage can't take down a whole tier.
# Backups are a reliability safety net: their answers aren't what the classifier predicted,
# so responses served by a backup should be logged as such.
fallback_chains:
  low: [groq-allam, ollama-llama]      # local llama3.2:3b: similar quality, no provider dependency
  medium: [groq-small, gemini-flash]   # gemini-flash: different provider, at least medium quality
  high: [groq-large, gemini-flash]     # only non-Groq option; free tier is tiny (20/day), backup only

# Retries apply only to rate limits (429) and server errors (5xx).
retry:
  max_attempts: 3            # tries per model, including the first one
  base_delay_seconds: 0.5    # first wait is up to 0.5s, then up to 1s, then 2s...
  max_delay_seconds: 8       # never wait longer than this between tries

# After this many failures in a row, skip that provider for a while.
circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 60

# No single call may take longer than this (seconds), unless model_timeouts says otherwise.
# 8 = groq-large p95 (6,652 ms, rounded up to 7 s) + 1 s margin, from reports/latency_p95.json
# (eval/latency_report.py: Phase 2 train-split answers, cache hits and errors excluded).
# groq-allam and groq-small never exceeded 4.9 s in Phase 2, so the default covers all their calls.
timeout_seconds: 8

# Per-model timeout overrides (seconds). Use for models whose normal latency is far above the default.
# tests/test_timeouts.py checks each value against reports/latency_p95.json.
model_timeouts:
  # groq-large (strong tier): p99 8,709 ms -> 9 s + 1 s margin; 0 of 568 Phase 2 calls exceed it.
  # Intentionally p99, not p95, for this one model: the strong tier gets the hardest prompts, whose slowest
  # calls are the long answers it exists for. Timing them out (2.8% of calls at 8 s) sends traffic to a
  # 20/day fallback whose answers the classifier never saw.
  groq-large: 10
  # gemini-flash: no Phase 2 latency data. It is the last fallback for medium and high, so a generous
  # limit beats returning an error. Revisit once live latency data exists.
  gemini-flash: 30
  # ollama-llama (local llama3.2:3b, low-tier backup): p95 30,785 ms -> 31 s + 1 s margin
  # (reports/latency_p95.json). With the 8 s default, 33% of its Phase 2 calls would have been killed;
  # with 32 s, 4.8%. Phase 2 ran it alongside the other tiers on the same machine.
  ollama-llama: 32

# Streaming (Phase 4 Step 5): a time-to-first-token limit, not a total-time limit. A stream whose first
# piece doesn't arrive in time fails over to the next model in the chain (only possible before any text is
# sent); a long answer that is streaming steadily is never cut off. The per-call timeout above still applies
# to each read, so it also limits the gap between pieces. There is no Phase 2 time-to-first-token data yet
# (collection did not stream), so these start at the same values as the timeouts above. Revisit with live data.
streaming:
  first_token_timeout_seconds: 8
  model_first_token_timeouts:
    groq-large: 10
    gemini-flash: 30
    ollama-llama: 32

# Answer verification in the API (Phase 4 Step 7; app/api/verification.py, app/api/background.py).
# Not changeable with PUT /v1/routing-config: edit this file and restart.
verification:
  # X-Triage-Verify: sync (model "auto", non-streaming). For the tier that answered: the checks to run, in order
  # (format = the free format checker; ai_checker = config/checker.yaml, v3, groq-small), and where a "bad"
  # answer goes. The escalated tier then gets its own checks. Default: no AI checker on low (a check costs 2-6x a
  # low answer, reports/PHASE_4.md Step 1 notes). To be revisited once Step 3 picks a strategy on validation.
  sync:
    tiers:
      low:
        checks: [format]
        escalate_to: medium
      medium:
        checks: [format, ai_checker]
        escalate_to: high
      high:
        checks: []                 # the strong answer is final and never checked
    on_error: escalate             # the AI checker errored or gave no verdict: escalate | accept
    agreement_on_comparable: false # reserved: agreement instead of the AI checker on comparable prompts
                                   # (Step 3 strategy b). Not built; true is rejected at startup.
  # Default mode (no X-Triage-Verify, or off): after the response is sent, a sample of "auto" requests (served
  # tier low or medium, no fallback) is graded against the strong model's answer by the judge (v3) and written
  # to the labels table. Noisy labels: see app/api/background.py.
  background:
    sample_rate: 0.1
    # groq-large's whole free budget is 200K tokens/day (config/collection.yaml limits), and it is shared with
    # live high-tier traffic and sync escalations, so background labeling gets at most a quarter of it.
    # Startup refuses a token cap above half of the strong or judge model's daily budget.
    daily_max_calls: 50            # strong answers + judge calls per UTC day (both use groq-large)
    daily_max_tokens: 50000

# Request settings. These MUST match the Phase 2 collection (config/collection.yaml): the classifier
# predicts "will this model pass with THESE settings?" (tests/test_live_settings.py checks they match).
# Callers may override generation per call; model_params can only be set here.
generation:
  temperature: 0
  max_tokens: 4000

# Extra request parameters per MODEL (not per tier), so a fallback like gemini-flash never receives
# a parameter meant for another model. reasoning_effort "low" is what gpt-oss was collected with.
model_params:
  groq-small:
    reasoning_effort: low
  groq-large:
    reasoning_effort: low

# NOTE (Phase 4 Step 0): these tau values were chosen for classifier v1 and have NOT been re-tuned for
# classifier_c_logreg_cv v2. They will be re-picked on the validation set in Step 3 (reports/PHASE_4.md).
# Quality dial (tau): route to the cheapest tier whose predicted pass probability is >= tau.
# Presets chosen from the train-set Pareto curve (out-of-fold probabilities, classifier_c_logreg_cv v1),
# one rule each. The test set was not used. Train-set results in brackets.
quality:
  default: balanced          # used when a request has no X-Triage-Quality header
  presets:
    cheap: 0.68              # best quality at always-medium's cost or less   [88.5% kept, 63% saved]
    balanced: 0.86           # cheapest tau keeping 95% of strong quality      [95% kept, 23% saved]
    high: 0.89               # cheapest tau keeping 98% of strong quality      [98% kept, 11% saved]

# The trained classifier the live router uses (models/<name>_<tier>_v<version>.joblib/.json).
# Chosen in Phase 3 Step 4: classifier_b_logreg_cv and classifier_c_logreg_cv tied on the train-set
# Pareto curve; C is kept because it includes the handcrafted features, which make decisions
# easier to explain.
# v2 (Phase 4 Step 0): same model, retrained on the fit set (validation held out) with FEATURE_VERSION 3 and
# hand-tagged task types. It tied the guessed-task-type candidate on validation, so hand tags stay
# (reports/PHASE_4.md, reports/candidates_val.json).
classifier:
  name: classifier_c_logreg_cv
  version: 2
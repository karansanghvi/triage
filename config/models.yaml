# Triage model registry
# All prices are in US dollars per 1 million tokens.
# input_price / output_price = what you actually pay (0 on free tiers and local models)
# price_as = the realistic paid price, used for savings math on the dashboard
# Tiers match the Phase 2 data collection (config/collection.yaml):
#   low = groq-allam, medium = groq-small, high = groq-large. Other models are backups or extras.
# Within one provider, tiers are ordered by price: low < medium < high. Across providers they are
# not: a tier is a capability slot in a fallback chain (openai-luna is "low" but costs more than groq-large).
# The openai and anthropic models at the end are BYOK-only (bring your own key): routing.yaml's
# server_providers leaves them out of every chain for requests without their own key.

models:
  # ---------- Low tier: cheapest ----------
  # Smallest non-reasoning text model on Groq's free tier (Llama 3.1 8B was shut off for free
  # accounts on 2026-08-16). Bilingual Arabic/English, 4,096-token context window.
  # Phase 2 low tier.
  - name: groq-allam
    provider: groq
    model_id: allam-2-7b
    tier: low
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      # Groq lists ALLaM 2 7B's paid price as "Pending" (2026-10-19). Until it is published, this
      # uses Groq's last price for its deprecated small model, Llama 3.1 8B Instant ($0.05 / $0.08).
      # Groq's own pricing page no longer shows it; the figure is from price aggregators
      # (cloudprice.net, costbench.com), which agree.
      label: "estimate: last Groq price of Llama 3.1 8B, allam price pending"
      input_price: 0.05
      output_price: 0.08

  # Local model: Phase 2 "extra" tier and the low tier's backup in routing.yaml.
  # Priced like a comparable small hosted model, which is what it would cost if you didn't host it.
  # (Before 2026-11-05 this was priced like gpt-oss-20b at $0.10 / $0.50, which overstated it;
  # Phase 2's saved answers still carry costs computed with that old price.)
  - name: ollama-llama
    provider: ollama
    model_id: llama3.2:3b
    tier: low
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      label: "estimate: small-model price (same as the allam estimate)"
      input_price: 0.05
      output_price: 0.08

  # No longer used (blocked for collection, removed from routing). Kept for history.
  - name: ollama-qwen
    provider: ollama
    model_id: qwen2.5:3b
    tier: low
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      label: "estimate: small-model price (same as the allam estimate)"
      input_price: 0.05
      output_price: 0.08

  # ---------- Medium tier ----------
  # Phase 2 medium tier.
  - name: groq-small
    provider: groq
    model_id: openai/gpt-oss-20b
    tier: medium
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      label: Groq gpt-oss-20b (paid)       # console.groq.com/docs/models, checked 2026-10-19
      input_price: 0.075
      output_price: 0.30

  # ---------- High tier: strongest and most expensive ----------
  # Phase 2 high tier.
  - name: groq-large
    provider: groq
    model_id: openai/gpt-oss-120b
    tier: high
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      label: Groq gpt-oss-120b (paid)      # console.groq.com/docs/models, checked 2026-10-19
      input_price: 0.15
      output_price: 0.60

  # Backup for the medium and high tiers in routing.yaml (the only non-Groq option).
  # Free tier is tiny (5 RPM, 20 requests/day): backup only.
  - name: gemini-flash
    provider: gemini
    model_id: models/gemini-3.8-flash
    tier: high
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      # aistudio.google.com/docs/pricing, checked 2026-11-12: $0.75 / $3.75 is the price "through Dec 31 2026";
      # from 2027-01-01 it becomes $1.50 / $7.50. Kept at the current price for now: update it on that date.
      label: Gemini 3.8 Flash (paid)
      input_price: 0.75
      output_price: 3.75

  # Registry only (not in any fallback chain yet). Stable, free tier, no shutdown date announced.
  # 1M context / 64K output; thinks by default at the "minimal" level.
  # aistudio.google.com/docs/pricing and /docs/models, checked 2026-11-12.
  - name: gemini-flash-lite
    provider: gemini
    model_id: models/gemini-3.5-flash-lite
    tier: low
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    price_as:
      label: Gemini 3.5 Flash-Lite (paid)
      input_price: 0.30
      output_price: 2.50

  # No longer used (blocked for collection, removed from routing). Kept for history.
  # Note: this is a Groq "preview" model, so Groq may remove it someday.
  # On the free tier it can only handle about one request per minute.
  - name: groq-qwen
    provider: groq
    model_id: qwen/qwen3.8-27b
    tier: high
    input_price: 0
    output_price: 0
    avg_latency_ms: 0
    max_output_tokens: 800     # free tier allows only 1,000 output tokens per minute
    price_as:
      label: Groq Qwen3.8 27B (paid)
      input_price: 0.80
      output_price: 4.00

  # ---------- BYOK only: OpenAI ----------
  # Used only by requests that bring their own OpenAI key (never with Triage's keys; see routing.yaml
  # server_providers). The caller pays, so input_price / output_price are the real list prices.
  # Standard tier, prompts up to 272K tokens (above that: 2x input, 1.5x output).
  # Source: developers.openai.com/api/docs/pricing and /api/docs/models/<id>, checked 2026-11-12.
  # None of these three is promotional (the page's only promo notes name gpt-5.6-sol and gpt-6-astra-law).
  # All three are reasoning models, 1,050,000-token context, 128K max output.
  # NOTE: the OpenAI adapter still sends temperature and max_tokens; fixing that for reasoning models is the
  # next step, so these don't work yet even with a key.
  - name: openai-luna
    provider: openai
    model_id: gpt-6-luna
    tier: low
    input_price: 0.10
    output_price: 0.50
    avg_latency_ms: 0

  - name: openai-terra
    provider: openai
    model_id: gpt-6.1-terra
    tier: medium
    input_price: 1.00
    output_price: 5.00
    avg_latency_ms: 0

  - name: openai-sol
    provider: openai
    model_id: gpt-6.1-sol
    tier: high
    input_price: 2.00
    output_price: 10.00
    avg_latency_ms: 0

  # ---------- BYOK only: Anthropic ----------
  # Same rules as the OpenAI models above. Source: platform.claude.com/docs/en/about-claude/pricing and
  # /about-claude/models/overview, checked 2026-11-12. The IDs are both alias and pinned snapshot.
  # 1M context, 128K max output. Adaptive thinking is on by default and counts toward max_tokens.
  # NOTE: these reject `temperature` (400), which the Anthropic adapter still sends: fixed in the next step.
  - name: claude-haiku
    provider: anthropic
    model_id: claude-haiku-5-5
    tier: low
    # $0.10 / $0.50 for prompts up to 100K tokens; $0.50 / $2.50 above that (not modeled here)
    input_price: 0.10
    output_price: 0.50
    avg_latency_ms: 0

  - name: claude-sonnet
    provider: anthropic
    model_id: claude-sonnet-5-5
    tier: medium
    input_price: 2.00
    output_price: 10.00
    avg_latency_ms: 0

  - name: claude-opus
    provider: anthropic
    model_id: claude-opus-5-5
    tier: high
    input_price: 4.00
    output_price: 20.00
    avg_latency_ms: 0

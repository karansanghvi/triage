# Render blueprint for the Triage API. Setup, every variable and the smoke test: DEPLOY.md.
#
# Values are given only for non-secret build and runtime mechanics. Every other variable is `sync: false`: Render
# asks for it in the dashboard when the blueprint is first applied, and it is never stored in this file.
# Plan: Standard (1 CPU, 2 GB). The API peaks around 660 MB, so 512 MB plans don't fit (DEPLOY.md, "Memory").
services:
  - type: web
    name: triage-api
    runtime: python
    region: oregon
    plan: standard
    branch: main
    # Exact versions (CPU-only torch), then the embedding model into .hf-cache inside the app, checked offline
    buildCommand: pip install -r requirements.lock && python -m scripts.fetch_embedding_model
    # Schema first (on DATABASE_URL_UNPOOLED, Neon's direct connection), then ONE worker: demo, sign-in and
    # per-minute limits, the circuit breakers and caches live in this process's memory
    startCommand: alembic upgrade head && exec uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      # ----- build and runtime mechanics (not secret) -----
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: HF_HOME
        value: /opt/render/project/src/.hf-cache
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TRIAGE_TORCH_THREADS
        value: "1"
      # Render has no Ollama: route among the providers that exist there
      - key: TRIAGE_SERVER_PROVIDERS
        value: groq,gemini

      # ----- database (Neon) -----
      - key: DATABASE_URL                 # the POOLED connection string (host contains "-pooler")
        sync: false
      - key: DATABASE_URL_UNPOOLED        # the DIRECT connection string, for alembic upgrade head
        sync: false
      - key: TRIAGE_DB_PREPARED_STATEMENTS   # optional: auto (default), on, off
        sync: false

      # ----- secrets: generate fresh for production (DEPLOY.md) -----
      - key: TRIAGE_HASH_SECRET
        sync: false
      - key: TRIAGE_ENCRYPTION_KEYS
        sync: false
      - key: TRIAGE_API_KEYS
        sync: false
      - key: TRIAGE_ADMIN_KEYS
        sync: false

      # ----- providers -----
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ----- public website, accounts and email -----
      - key: TRIAGE_PUBLIC
        sync: false
      - key: TRIAGE_ACCOUNTS
        sync: false
      - key: TRIAGE_CORS_ORIGINS
        sync: false
      - key: TRIAGE_TRUSTED_PROXY_HOPS
        sync: false
      - key: TRIAGE_APP_URL
        sync: false
      - key: TRIAGE_PUBLIC_API_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TRIAGE_EMAIL_FROM
        sync: false
      - key: TRIAGE_EMAIL_LOGO_URL
        sync: false

      # ----- optional tuning (defaults are right for production) -----
      - key: TRIAGE_REQUEST_LOG_RETENTION_DAYS
        sync: false
      - key: TRIAGE_PUBLIC_STATS_MIN_REQUESTS
        sync: false
      - key: TRIAGE_KEYLESS_LOOKUP_MINUTES
        sync: false
